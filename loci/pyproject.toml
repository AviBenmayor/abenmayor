[project]
name = "loci"
version = "0.1.0"
description = "Walkable daily-needs retail completeness and residual undersupply, at H3 hex resolution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # data / db
  "duckdb>=1.5",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pyyaml>=6.0",
  # geo
  "geopandas>=1.0",
  "shapely>=2.0",
  "h3>=4.1",
  "osmnx>=2.0",
  "networkx>=3.3",
  "tobler>=0.11",
  "pyproj>=3.6",
  # sources
  "overturemaps>=0.14",
  "census>=0.8",
  "requests>=2.32",
  # model
  "statsmodels>=0.14",
  "linearmodels>=6.1",
  "spreg>=1.5",
  "esda>=2.6",
  "libpysal>=4.12",
  # cli / viz
  "typer>=0.12",
  "rich>=13.9",
  "matplotlib>=3.9",
]

[project.scripts]
loci = "loci.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loci"]

[tool.hatch.build.targets.wheel.force-include]
"src/loci/registry.yaml" = "loci/registry.yaml"
"src/loci/sql" = "loci/sql"

[tool.ruff]
line-length = 100
target-version = "py312"
