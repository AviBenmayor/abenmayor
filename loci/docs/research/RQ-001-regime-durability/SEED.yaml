# Ouroboros Seed Specification — RQ-001 (IMMUTABLE; changes go through a new generation, not edits)
# Generated: 2026-09-22 from a 4-round /interview with the owner
# Saved here rather than loci/.ouroboros/ per the three-top-level-directories standard.
# Ambiguity Score: 0.17

goal: "Answer Loci research question RQ-001 — 'If a restaurant buys into an NYC address, how long do favorable neighborhood conditions last, and what ends them?' — as (1) a citywide base-rate distribution of favorable-regime duration, (2) ranked drivers of regime exit with macro tested as a hypothesis, and (3) a per-address expected-duration function, reported separately for owner and tenant and split by restaurant segment; delivered inside a reusable research-question framework that every future Loci question must follow. This session ships the framework, data audit, a provisional v0 ZIP-tier answer, and the Linear ticket tree."

constraints:
  - "Unit of analysis is the address trade area (Loci address grain), aggregated up for reporting; no hex tables (owner 2026-09-05/09-09)."
  - "Favorable regime = composite of demand (foot traffic, residents/workers, income), supply (restaurant density/saturation) and cost (rent); 'favorable' = top tercile among NYC trade areas in the same year."
  - "'Full shift' measured two ways — data-driven regime model (Markov/HMM clustering) and a fixed-threshold rule — and compared; neither alone is the answer."
  - "Two tiers: ZIP-level CBP/ZBP + ACS panel 1994→present for the long base rate; address-level panel ~2010→present for calibration and per-site scoring."
  - "Durations are right-censored survival data; ongoing regimes are never dropped or treated as ended."
  - "Macro enters only through free series (FRED/BLS: NYC unemployment, restaurant employment, rates, CPI food-away-from-home, NBER recessions, COVID window) and is tested as a hypothesis, not assumed."
  - "Free sources pulled in full, no caps/windows/samples (owner rule 2026-09-16); a paid historical foot-traffic source is scoped with a quote only, nothing bought without an explicit owner budget ruling."
  - "Owner (property-purchase) and tenant (lease) readings reported separately."
  - "Restaurants = all full- and limited-service, with a breakdown by Loci category where sample supports it."
  - "Loci structure: code in src/loci/, loose scripts become CLI subcommands, research doc lives in docs/, generated data gitignored."
  - "Tickets generated from tickets.py, never hand-written; a CHECKPOINT decision and its ticket land in one edit (check-tickets hook)."
  - "Session model: executive directs; Sonnet runs analyses and writes code, Opus only judges methodology, Haiku does mechanical edits; one-line spec shown before each dispatch."
  - "Concurrent-session safety: check peers before editing cli.py, tickets.py, CHECKPOINT.md, claiming D-ids/migration numbers, or running the full suite; stage by explicit path/patch."
  - "Publishing: executed .ipynb in repo only (no HTML artifact, no Notion mirror for this question)."

acceptance_criteria:
  - {id: AC-1, description: "docs/research/RQ-001-regime-durability/ exists containing QUESTION.md, DATA-AUDIT.md, an executed notebook, and ANSWER.md.", verification: "ls the folder; notebook has non-empty outputs in every code cell."}
  - {id: AC-2, description: "QUESTION.md records the seed's goal, constraints, definitions (regime, favorable, full shift, unit, tiers) and interview rulings verbatim.", verification: "Inspection; every constraint in this seed appears in QUESTION.md."}
  - {id: AC-3, description: "`loci research new <slug>` scaffolds a new RQ-NNN folder with the standard file set and the next free number.", verification: "Run into a temp dir; the template files exist; a test covers numbering."}
  - {id: AC-4, description: "`loci research check` exits non-zero when any RQ folder is missing a required stage file or references a ticket not defined in tickets.py.", verification: "pytest fixture deleting ANSWER.md and one with a dangling ticket id both fail; the real tree passes."}
  - {id: AC-5, description: "A Claude skill encodes the fixed research sequence (interview → seed → data audit → build → answer → review → tickets → checkpoint) and points at the CLI gate.", verification: "Skill file exists, lists every stage in order, references `loci research check` as the exit gate."}
  - {id: AC-6, description: "DATA-AUDIT.md lists every input the question needs with publisher, registry id, history depth, grain, and present/partial/missing status; every missing/partial maps to a ticket id.", verification: "Inspection plus AC-4 check (ticket ids resolve)."}
  - {id: AC-7, description: "The notebook reruns end to end from the warehouse with one command (`loci research run RQ-001` or a make target).", verification: "Clean run succeeds; output notebook cell count matches source."}
  - {id: AC-8, description: "Notebook produces a v0 ZIP-tier distribution of favorable-regime duration (Kaplan–Meier median + IQR, censoring stated) from data already in the warehouse.", verification: "Notebook cell outputs a KM table/plot plus censored share."}
  - {id: AC-9, description: "Notebook compares duration under the regime-model definition vs the threshold definition and reports the sensitivity.", verification: "Notebook cell shows both medians and their difference."}
  - {id: AC-10, description: "Notebook tests macro as a hazard driver on available macro data (or states explicitly it is blocked on the macro-ingest ticket) and reports ranked drivers of regime exit.", verification: "Driver table exists; macro either estimated or marked BLOCKED with ticket id."}
  - {id: AC-11, description: "ANSWER.md and the notebook's final markdown cell give a plain-language provisional answer (owner vs tenant, by segment where possible) with confidence, known gaps, and the tickets that close them.", verification: "Inspection; labeled v0/provisional; cites ticket ids."}
  - {id: AC-12, description: "v0 records the validation plan: out-of-time backtest vs median-for-all baseline; urban-planner named-neighborhood check; contrarian + statistician verdict; operator-site spot check — each either run or ticketed.", verification: "Each of the four appears in ANSWER.md marked RUN (with result) or TICKETED (with id)."}
  - {id: AC-13, description: "Linear has a 'Research questions' milestone in the Loci project with an RQ-001 parent issue.", verification: "Linear MCP returns them."}
  - {id: AC-14, description: "RQ-001 has subtickets for framework, macro ingest, address panel, paid foot-traffic quote, ZIP tier, address tier, validation reviews, and a recurring drift re-run, each with reasoning in the description.", verification: "list_issues(parent) returns ≥8 children, each with a 'Why' section."}
  - {id: AC-15, description: "Every Linear ticket is generated from tickets.py; TICKETS.md, linear-import.csv, linear-tickets.json regenerated and in sync.", verification: "`loci check-tickets` passes."}
  - {id: AC-16, description: "CHECKPOINT.md has a new dated decision entry for RQ-001 + the framework, with its ticket defined in the same edit.", verification: "`loci check-tickets` passes; decision id appears in both CHECKPOINT.md and tickets.py."}

ontology_schema:
  name: RegimeDurability
  description: "Neighborhood regime spells for restaurant favorability, per trade area over time, plus the research-question framework that wraps any such analysis."
  fields:
    - {name: trade_area_id, type: string, description: "Address-grain trade-area key (or ZIP for the long tier)."}
    - {name: tier, type: string, description: "'zip_1994' or 'address_2010'."}
    - {name: year, type: number, description: "Panel year."}
    - {name: demand_pillar, type: object, description: "Foot traffic, residents, workers, income; standardized within year."}
    - {name: supply_pillar, type: object, description: "Restaurant density/saturation by segment; standardized within year."}
    - {name: cost_pillar, type: object, description: "Rent / property value (ZORI/ZHVI, rent proxies); standardized within year."}
    - {name: composite_score, type: number, description: "Combined pillar score; favorable = top tercile citywide that year."}
    - {name: regime_state, type: string, description: "Regime-model state (e.g. emerging/favorable/saturated/declining) plus a separate threshold-rule state."}
    - {name: spell, type: object, description: "Contiguous run of favorable years: start_year, end_year, duration, censored flag, definition used."}
    - {name: exit_driver, type: array, description: "Pillar or macro changes coinciding with / preceding spell exit (hazard covariates)."}
    - {name: macro_covariates, type: object, description: "Yearly NYC unemployment, restaurant employment, rates, CPI food-away, recession flag, COVID flag."}
    - {name: segment, type: string, description: "Loci restaurant category or 'all'."}
    - {name: tenure_view, type: string, description: "'owner' or 'tenant' — tenant weighs cost pillar and lease horizon more."}
    - {name: research_question, type: object, description: "Framework entity: rq_id, slug, stage files, linear parent id, ticket ids, status."}

evaluation_principles:
  - {name: honest_uncertainty, weight: 0.25, description: "Censoring handled, confidence stated, v0 labeled provisional, gaps tied to tickets; no number more precise than the data supports."}
  - {name: reproducibility, weight: 0.20, description: "One command reruns the notebook from the warehouse; no hand steps; data audit matches registry."}
  - {name: framework_repeatability, weight: 0.20, description: "A second research question could follow the identical scaffold, skill, and gate with no ad-hoc structure."}
  - {name: answers_the_buyer, weight: 0.20, description: "Final text directly answers 'how long should a buyer expect favorable conditions to last, and what ends them' for owner vs tenant."}
  - {name: drift_resistance, weight: 0.15, description: "Tickets generated from code, check gate catches missing stages/dangling ids, recurring re-run ticketed."}

exit_conditions:
  - {name: success, description: "All 16 ACs verified this session.", criteria: "`loci research check` and `loci check-tickets` pass; notebook executes; Linear returns milestone, parent, ≥8 children."}
  - {name: blocked_on_peer, description: "A concurrent session holds cli.py, tickets.py, or CHECKPOINT.md.", criteria: "Peer message or unowned diff in those files → stop, write held text to memory, report."}
  - {name: data_insufficient_for_v0, description: "Warehouse can't support even a ZIP-tier KM estimate.", criteria: "Audit shows no usable multi-year panel → ship framework + audit + tickets; mark AC-8/9/10 BLOCKED with ticket ids, never fabricate."}
  - {name: scope_growth, description: "Work grows past approved one-line specs.", criteria: "Stop and surface the addition as a new one-line spec for approval."}

