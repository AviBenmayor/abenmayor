<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Missing Business — NYC</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ea;--panel:#fffdf9;--ink:#1c1a16;--ink2:#57524a;--muted:#948d80;--line:#e4dfd4;--accent:#b5541f;
  --shadow:0 1px 2px rgba(28,26,22,.06),0 8px 26px rgba(28,26,22,.10)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;z-index:2}
h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink2);font-size:12.5px;max-width:52ch;line-height:1.4;margin:0}
main{flex:1;min-height:0;display:flex}
.side{width:262px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;flex:none}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
h2{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.opt{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--bg)}.opt[aria-pressed=true]{background:var(--bg);font-weight:600}
.opt .sw{width:11px;height:11px;border-radius:3px;flex:none}.opt .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.boros{display:flex;flex-wrap:wrap;gap:5px}
.boros button{border:1px solid var(--line);background:var(--bg);color:var(--ink2);font:inherit;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;cursor:pointer}
.boros button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
input[list]{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.clear{margin-top:6px;font-size:11px;color:var(--muted);background:0;border:0;cursor:pointer;text-decoration:underline;padding:0}
.mapwrap{position:relative;flex:1;min-width:0}
#map{position:absolute;inset:0}
.banner{position:absolute;top:12px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:flex;align-items:center;gap:9px;z-index:1;max-width:72%}
.banner .sw{width:13px;height:13px;border-radius:4px;flex:none}.banner b{font-size:13px}.banner .bsub{color:var(--muted);font-size:11.5px;margin-top:1px}
.maplibregl-popup-content{font-family:"Public Sans",sans-serif;border-radius:10px;padding:9px 12px;box-shadow:var(--shadow)}
.pnb{font-weight:700;font-size:13px}.ppop{color:#57524a;font-size:11.5px;margin-top:1px}
.pmi{margin-top:6px;font-size:10px;color:#948d80;text-transform:uppercase;letter-spacing:.06em}
.biz{display:inline-block;margin:3px 4px 0 0;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;color:#fff}
</style></head><body>
<header><h1>The Missing Business</h1>
  <p class="sub">Walkable, lived-in NYC areas lacking one business their neighbors all have. Filter, then zoom in on a real map.</p></header>
<main>
  <aside class="side">
    <div class="sec"><h2>Missing business</h2><div id="opts"></div></div>
    <div class="sec"><h2>Borough</h2><div class="boros" id="boros"></div></div>
    <div class="sec"><h2>Neighborhood</h2>
      <input list="ntal" id="ntaIn" placeholder="e.g. Williamsburg, Lower East Side">
      <datalist id="ntal"></datalist>
      <button class="clear" id="ntaClear" hidden>clear neighborhood</button></div>
  </aside>
  <div class="mapwrap"><div id="map"></div><div class="banner" id="banner"></div></div>
</main>
<script>
let META, FC, biz=null, boro=null, nta=null;
const map=new maplibregl.Map({container:'map',
  style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center:[-73.95,40.70],zoom:9.6,attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');

map.on('load',async()=>{
  META=await (await fetch('meta.json')).json();
  FC=await (await fetch('hexes.geojson')).json();
  map.addSource('hex',{type:'geojson',data:FC});
  map.addLayer({id:'hex-fill',type:'fill',source:'hex',
    paint:{'fill-color':'#c9c3b6','fill-opacity':0.1}},firstSymbolLayer());
  map.addLayer({id:'hex-line',type:'line',source:'hex',
    paint:{'line-color':META.colors.convenience,'line-width':['interpolate',['linear'],['zoom'],10,0.3,14,1.4],'line-opacity':0.9}},firstSymbolLayer());
  buildUI();
  biz='convenience';                         // sensible default
  apply(true);
  map.on('click','hex-fill',popup);
  map.on('mouseenter','hex-fill',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','hex-fill',()=>map.getCanvas().style.cursor='');
});
function firstSymbolLayer(){for(const l of map.getStyle().layers)if(l.type==='symbol')return l.id;}

function bizSel(){return biz==null?['==',['get','gap'],1]:['in',biz,['get','missing']];}
function areaFilter(){const f=['all'];if(boro)f.push(['==',['get','boro'],boro]);if(nta)f.push(['==',['get','nta'],nta]);return f;}
function apply(fit){
  const gray='#c9c3b6';
  const color=biz==null?['case',['==',['get','gap'],1],META.colors.hardware,gray]:['case',bizSel(),META.colors[biz],gray];
  map.setPaintProperty('hex-fill','fill-color',biz==null?['case',['==',['get','gap'],1],'#b5541f',gray]:['case',bizSel(),META.colors[biz],gray]);
  map.setPaintProperty('hex-fill','fill-opacity',['case',bizSel(),0.72,0.08]);
  map.setFilter('hex-fill',areaFilter());
  map.setPaintProperty('hex-line','line-color',biz==null?'#b5541f':META.colors[biz]);
  map.setFilter('hex-line',['all',bizSel(),...areaFilter().slice(1)]);
  updateBanner();
  if(fit)fitToArea();
}
function fitToArea(){
  let w=999,s=999,e=-999,n=-999,any=false;
  for(const f of FC.features){
    const p=f.properties; if(boro&&p.boro!==boro)continue; if(nta&&p.nta!==nta)continue;
    if(!boro&&!nta){ if(p.gap!==1)continue; if(biz&&!p.missing.includes(biz))continue; }
    any=true; for(const c of f.geometry.coordinates[0]){if(c[0]<w)w=c[0];if(c[0]>e)e=c[0];if(c[1]<s)s=c[1];if(c[1]>n)n=c[1];}
  }
  if(any)map.fitBounds([[w,s],[e,n]],{padding:60,duration:700,maxZoom:15});
}
function counts(){let a=0,pop=0;for(const f of FC.features){const p=f.properties;
  if(boro&&p.boro!==boro)continue;if(nta&&p.nta!==nta)continue;
  const sel=biz==null?p.gap===1:p.missing.includes(biz); if(sel){a++;pop+=p.pop;}}return[a,pop];}
function updateBanner(){const[a,pop]=counts();
  const col=biz==null?'#b5541f':META.colors[biz];const name=biz==null?'a gap':META.catLabels[META.cats.indexOf(biz)];
  const area=nta||boro||'all NYC';
  document.getElementById('banner').innerHTML=`<span class="sw" style="background:${col}"></span><div><b>Missing: ${name}</b><div class="bsub">${area} · ${a.toLocaleString()} areas · ${(pop/1000).toFixed(0)}k residents</div></div>`;}

function popup(e){const p=e.features[0].properties;let miss=[];try{miss=JSON.parse(p.missing);}catch(_){miss=p.missing||[];}
  const chips=miss.length?miss.map(m=>`<span class="biz" style="background:${META.colors[m]}">${META.catLabels[META.cats.indexOf(m)]}</span>`).join(''):'<span style="color:#948d80">no conspicuous gap</span>';
  new maplibregl.Popup({closeButton:false,maxWidth:'240px'}).setLngLat(e.lngLat)
    .setHTML(`<div class="pnb">${p.nta}</div><div class="ppop">${(+p.pop).toLocaleString()} residents · ${p.boro}</div><div class="pmi">missing</div>${chips}`).addTo(map);}

function buildUI(){
  const opts=document.getElementById('opts');
  const mk=(label,color,count,val)=>{const b=document.createElement('button');b.className='opt';b.setAttribute('aria-pressed',val===biz);
    b.innerHTML=`<span class="sw" style="background:${color}"></span><span>${label}</span><span class="n">${count?count.toLocaleString():''}</span>`;
    b.onclick=()=>{biz=val;[...opts.children].forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');apply(true);};opts.appendChild(b);};
  mk('All gaps','#b5541f',META.nGap,null);
  Object.entries(META.gapCounts).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>mk(META.catLabels[META.cats.indexOf(c)],META.colors[c],n,c));
  const bel=document.getElementById('boros');
  const ball=document.createElement('button');ball.textContent='All';ball.dataset.b='';ball.setAttribute('aria-pressed','true');bel.appendChild(ball);
  META.boros.forEach(b=>{const x=document.createElement('button');x.textContent=b==='Staten Island'?'Staten Is.':b;x.dataset.b=b;bel.appendChild(x);});
  bel.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;boro=b.dataset.b||null;
    [...bel.children].forEach(c=>c.setAttribute('aria-pressed',(c.dataset.b||'')===(boro||'')));apply(true);};
  const dl=document.getElementById('ntal');META.ntas.forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);});
  const inp=document.getElementById('ntaIn'),clr=document.getElementById('ntaClear');
  inp.addEventListener('change',()=>{if(META.ntas.includes(inp.value)){nta=inp.value;clr.hidden=false;apply(true);}});
  clr.onclick=()=>{nta=null;inp.value='';clr.hidden=true;apply(true);};
}
</script></body></html>
