# ---------------------------------------------------------------------------
# THE CURATED CHAIN WATCHLIST -- the human-maintained source of truth.
#
# `loci chains detect` is a measurement and can be wrong (franchisee filings,
# DOHMH lag, brands no city dataset can see). This file OUTRANKS it. When the
# generated docs/CHAINS.md disagrees with a row here, the row here is what a
# person believed after looking, and the disagreement is printed rather than
# resolved.
#
# HAND-EDITABLE. `loci chains import <json>` upserts into it and, without
# --overwrite, NEVER clobbers a field that is already non-empty here.
#
# FIELDS
#   brand                 display name, as the company writes it
#   brand_key             MUST equal loci.chains.normalize.brand_key(brand);
#                         `loci chains render` checks this and fails loudly.
#                         It is the join key to chains.brand_snapshot.
#   category              the company's own word ("bakery", "climbing gym")
#   loci_category         one of the 15 in loci/categories.py, or null.
#                         This is the join key to the address screen -- the
#                         reason a brand can one day become "brand X is opening
#                         two blocks from this address" on a recommend card.
#   hq                    city
#   nyc_locations_now     integer or null. null means NOT COUNTED, not zero.
#   nyc_locations_12m_ago integer or null
#   net_new_12m           integer or null. The ranking key in docs/CHAINS.md.
#   pipeline              free text: signed leases, announced openings
#   ownership             corporate | franchise | mixed | pe_backed | null
#   expansion_role_title  the title that owns site selection -- the sales target
#   why_they_grow         one sentence. The reason, not the fact.
#   evidence              list of {url, date}. A claim with no evidence is a
#                         guess and `confidence` must say so: only `auto` and
#                         `unverified` rows may cite nothing.
#   confidence            verified | reported | unverified | auto
#                         PROVENANCE, not certainty. `auto` is the bottom of
#                         the scale: a machine applied the D109 rule and NOBODY
#                         HAS LOOKED. Only `loci chains auto-admit` writes it.
#
# THE DECISION BLOCK -- added 2026-09-15 with the auto-admission ruling. Every
# field is optional; a row without them is a hand-vetted row from before the
# block existed and reads as tier `admitted`, decided_by `owner`.
#
#   tier                  admitted | watch | rejected
#                         `watch` (D110, tier 3) is INTERNAL ONLY -- a one- or
#                         two-location operator with an intent signal. It is
#                         neither admitted nor rejected, so it keeps appearing
#                         in `loci chains candidates` until it graduates.
#                         `rejected` rows are KEPT, never deleted: a deleted
#                         rejection is a brand that returns next month with
#                         nothing recorded against it.
#   sales_role            prospect | incumbent | contraction | excluded
#                         `incumbent` is 100+ NYC locations: off the broker
#                         lead list's default sort, but it IS the "brand X is
#                         opening nearby" signal on a recommend card.
#   admission_reason      why it is on the list. For an auto row this is the
#                         predicate clause that fired plus the detect counts.
#   rejection_reason      why it is not. Read by nobody but the next curator,
#                         who is the person it is for.
#   decided_on            YYYY-MM-DD -- when the tier was set.
#   decided_by            auto | owner. `auto` means the monthly job wrote the
#                         row unprompted. `loci chains admit` PROMOTES an auto
#                         row by flipping this to `owner`; it leaves
#                         `confidence` alone, because "a person looked at the
#                         decision" is not "a person counted the stores".
#   locations_at_decision integer -- the detect count at the moment of the
#                         decision. THE ESCAPE HATCH READS THIS: a rejected
#                         brand re-surfaces as a candidate once its count has
#                         DOUBLED against it, so "rejected at 5 stores" never
#                         permanently hides a brand that is now at 20. A
#                         rejection written without it cannot re-surface on
#                         that arm at all.
#
#   first_added           YYYY-MM-DD
#   last_verified         YYYY-MM-DD or null
# ---------------------------------------------------------------------------
