# Loci category taxonomy anchor -- NAICS 2022.
#
# WHY NAICS: the outcome/context data this project runs against (Census ZBP/CBP
# establishment counts, SBA loan data, LODES WAC job counts) and the academic
# literature it leans on (Meltzer & Schuetz 2012, "Bodegas or Bagel Shops?")
# ALL classify by NAICS. The POI presence sources (OSM, Overture, Foursquare,
# NYC/NYS license rosters) do NOT carry NAICS at all -- they use their own free
# taxonomies (OSM tags, Overture `categories.primary`, DOHMH cuisine text, NYS
# license-type codes). Loci's 15 category slugs (src/loci/categories.py) are
# the thing every adapter normalizes onto; this file is the PIVOT that anchors
# what each slug MEANS in NAICS terms, so a claim like "grocery" can be
# compared against ZBP/CBP grocery establishment counts or the Meltzer&Schuetz
# grocery finding without re-deriving the mapping ad hoc each time.
#
# THIS FILE DOES NOT CLASSIFY INDIVIDUAL BUSINESSES. No POI source publishes
# NAICS, so no POI record is ever tagged via this file -- adapters keep
# classifying on their own native tags (osm key=value, Overture
# categories.primary, DOHMH cuisine keywords, NYS/NYC license types), listed
# below per slug so the ad hoc mapping lives in ONE place instead of scattered
# across reach.yaml, conveniences.yaml, demand.yaml, benchmarks.yaml,
# spend.yaml and six source adapters. Only src/loci/zbp_naics.yaml (Census
# ZBP/CBP validation, NAICS 2017) and registry.yaml's lodes_wac entry actually
# JOIN on a NAICS code; this file is their shared reference, not a new join
# path.
#
# PROVENANCE: NAICS 2022 reference files fetched from census.gov/naics
# 2026-09-05 (Cloudflare blocks the /naics/ landing page and search-style URLs
# at the edge -- 403 on both plain curl and WebFetch -- but the direct file
# paths below are NOT blocked):
#   https://www.census.gov/naics/2022NAICS/2022_NAICS_Structure.xlsx
#   https://www.census.gov/naics/2022NAICS/2022_NAICS_Descriptions.xlsx
#   https://www.census.gov/naics/concordances/2017_to_2022_NAICS.xlsx
#   https://www.census.gov/naics/concordances/2022_to_2017_NAICS.xlsx
# Saved under src/loci/naics/ (this directory). Parsed with openpyxl (throwaway
# script, NOT a project dependency -- run via
# `uv run --with openpyxl python ...` if re-deriving) into
# src/loci/naics/naics_2022.csv (code, title, level; 2,122 rows, 2-6 digit),
# so nothing at runtime needs to open an xlsx file.
#
# naics_2017 codes below are carried over verbatim from src/loci/zbp_naics.yaml
# (already verified live against the CBP API for NYC ZIPs, 2026-09-05) --
# not re-derived here, to avoid two sources of truth for the same 2017 codes.
# naics_2022 codes are those same codes run through the REAL
# 2017_to_2022_NAICS.xlsx concordance (never guessed/recalled from memory;
# every code below was grepped against naics_2022.csv by
# tests/test_categories_anchor.py). The concordance surfaced three retail-tier
# recodes nobody had caught: convenience 445120 -> 445131, pharmacy
# 446110 -> 456110, hardware 444130 -> 444140. All other codes are unchanged
# 2017 -> 2022.
#
# `sources:` lists the NATIVE tag each adapter actually keys on for this slug
# (grepped from the adapters, not invented): `osm` (shop/amenity/leisure
# key=value pairs, src/loci/sources/universal/osm_overpass.py),
# `overture` (categories.primary slugs,
# src/loci/sources/universal/overture_places.py -- restaurant additionally
# catches anything matching the dynamic suffix rule `*_restaurant`), `dohmh`
# (cuisine_description keyword classification, restaurant/cafe_bakery only,
# src/loci/sources/cities/nyc/dohmh.py), `nys_dos` (license_type codes,
# nails_beauty/hair_barber only, src/loci/sources/cities/nyc/nys_dos.py),
# `dcwp` (business_category keyword match, laundry/pharmacy only,
# src/loci/sources/cities/nyc/dcwp.py) and `nys_sla` (license description
# values, bar only, src/loci/sources/cities/nyc/nys_sla.py). A key is present
# only where a real mapping exists in the code; nothing here is invented.

# `headline: false` (owner ruling 2026-09-14) — a category whose gaps are too
# often coverage holes to LEAD a claim. The flag is read by
# model/recommend.non_headline_categories(): a demoted category can never be
# the lead (first) card of `loci recommend`, and its card says so. It changes
# NOTHING in the screen — the category keeps its gap rows, its ratio, its
# gap_score contribution and its place on the map (the signal-vs-filter rule,
# docs/CATEGORY-EXPANSION.md §4). It is a demotion of the CLAIM, not of the
# measurement. The precedent is D30 (clinic); the evidence for the two
# additions is docs/coverage-validation-2026-09.md §4/§9.
#
version: 1
computed_on: 2026-09-05

categories:

  grocery:
    label: "Grocery / supermarket"
    naics_2022: ["445110"]
    naics_2017: ["445110"]   # unchanged across the 2022 recode
    sources:
      osm: ["shop=supermarket", "shop=greengrocer", "shop=grocery"]
      overture:
        - grocery_store
        - organic_grocery_store
        - asian_grocery_store
        - international_grocery_store
        - mexican_grocery_store
        - kosher_grocery_store
        - indian_grocery_store
        - korean_grocery_store
        - japanese_grocery_store
        - russian_grocery_store
        - farmers_market

  convenience:
    label: "Bodega / convenience"
    naics_2022: ["445131"]   # RECODE: was 445120 "Convenience Stores" under 2017;
                             # 2022 NAICS splits 4451 into 44511 (grocery) and
                             # 44513 (Convenience Retailers and Vending Machine
                             # Operators) and 445131 "Convenience Retailers" is
                             # the 2022 home.
    naics_2017: ["445120"]
    sources:
      osm: ["shop=convenience"]
      overture: [convenience_store]

  pharmacy:
    label: "Pharmacy"
    naics_2022: ["456110"]   # RECODE: was 446110 "Pharmacies and Drug Stores"
                             # under 2017; 2022 moved Health and Personal Care
                             # Stores from sector 446 to 456 wholesale-recoded
                             # subsector renumbering across NAICS 44-45.
    naics_2017: ["446110"]
    sources:
      osm: ["amenity=pharmacy", "shop=chemist"]
      overture: [pharmacy, drugstore]
      dcwp: ["business_category ILIKE '%pharmac%'"]   # no-op on current DCWP
                                                       # data; DCWP doesn't
                                                       # license pharmacies.

  laundry:
    label: "Laundromat / dry cleaner"
    naics_2022: ["812310", "812320"]
    naics_2017: ["812310", "812320"]   # unchanged
    sources:
      osm: ["shop=laundry", "shop=dry_cleaning"]
      overture: [laundromat, laundry_services, dry_cleaning]
      dcwp:
        - "business_category ILIKE '%laundr%' OR '%dry clean%' (excludes 'industrial' -- see dcwp.py docstring: DCWP's consumer Laundries category has zero active licenses, Industrial Laundry is B2B linen supply, not a walk-in laundromat)"
      # D55: the licence roster publishes no retail-laundry category at all, so
      # the ANCHOR is the DCWP inspections feed (jzhd-m6uv), matched on an
      # exact, frozen set of business_category values -- an unseen laundry-like
      # value RAISES rather than being dropped (dcwp.KNOWN_LAUNDRY_CATEGORIES).
      dcwp_inspections: ["Retail Laundry", "Dry Cleaners - 230"]

  hair_barber:
    label: "Hair / barber"
    # NOT USABLE FOR HEADLINE CLAIMS (owner ruling 2026-09-14, D30 precedent).
    # GTM-48's address-frame coverage validation measured a true-coverage-hole
    # rate of 34.5% [28.3-41.3] once hair's Google type map is narrowed to its
    # own anchor (44.5% as requested) — a better-than-one-in-three chance that
    # a hair gap at a given site is a hole in the data rather than in the
    # market, which is not decidable at site level.
    # docs/coverage-validation-2026-09.md §4, §9(1).
    headline: false
    naics_2022: ["812111", "812112"]
    naics_2017: ["812111", "812112"]   # unchanged; 812112 (Beauty Salons)
                                       # bleeds with nails_beauty (812113) --
                                       # see zbp_naics.yaml header caveat.
    sources:
      osm: ["shop=hairdresser"]
      overture: [hair_salon, barber, hair_stylist, kids_hair_salon]
      nys_dos: ["DOSBARSHOPOWNER", "DOSBARRENTER"]

  nails_beauty:
    label: "Nail / beauty"
    naics_2022: ["812113"]
    naics_2017: ["812113"]   # unchanged
    sources:
      osm: ["shop=beauty"]
      overture:
        - nail_salon
        - beauty_salon
        - spas
        - day_spa
        - health_spa
        - eyelash_service
        - eyebrow_service
        - waxing
      nys_dos: ["DOSAEBUSINESS", "DOSAERENTER"]

  tailor_repair:
    label: "Tailor / repair"
    # NOT USABLE FOR HEADLINE CLAIMS (owner ruling 2026-09-14, D30 precedent).
    # D50 already said so in prose (validation/google_places.py: Table A has no
    # `shoe_repair` type); GTM-48 put a number on it — a true-coverage-hole
    # rate of 37.5% [31.1-44.4], and a FLOOR, because Google's `tailor` is
    # narrower than loci's 811430 category, so the true rate is at least this.
    # docs/coverage-validation-2026-09.md §4, §9(1).
    headline: false
    naics_2022: ["811430"]   # unchanged; deliberate undercount -- see
                             # zbp_naics.yaml: true clothing tailors scatter
                             # across 315990 (apparel mfg) and 812990 (other
                             # personal services) with no clean NAICS home,
                             # this is the closest single code (dominated in
                             # NYC by shoe repair).
    naics_2017: ["811430"]
    sources:
      osm: ["shop=tailor", "shop=shoe_repair", "shop=clothes_repair"]
      overture: [gents_tailor, sewing_and_alterations, shoe_repair]

  restaurant:
    label: "Restaurant"
    naics_2022: ["722511", "722513"]
    naics_2017: ["722511", "722513"]   # unchanged
    sources:
      osm: ["amenity=restaurant", "amenity=fast_food"]
      overture:
        - restaurant
        - fast_food_restaurant
        # plus the dynamic suffix rule: any primary category ending in
        # `_restaurant` (the ~150-value cuisine family, e.g.
        # chinese_restaurant, pizza_restaurant) -- see overture_places.py
        # _category_for().
      dohmh: ["cuisine_description not matching CAFE_KEYWORDS (default branch of dohmh.py classify())"]

  cafe_bakery:
    label: "Cafe / bakery"
    naics_2022: ["722515", "311811"]
    naics_2017: ["722515", "311811"]   # unchanged; 311811 is a manufacturing-
                                       # sector code (undercounts bakeries
                                       # that are primarily cafe seating) --
                                       # see zbp_naics.yaml.
    sources:
      osm: ["amenity=cafe", "shop=bakery"]
      overture: [cafe, coffee_shop, bakery, hong_kong_style_cafe]
      dohmh: ["cuisine_description matching CAFE_KEYWORDS: coffee, tea, bakery, donut, doughnut, dessert, juice, ice cream, bagel, cafe/café (dohmh.py CAFE_KEYWORDS)"]

  bar:
    label: "Bar / pub"
    naics_2022: ["722410"]
    naics_2017: ["722410"]   # unchanged
    sources:
      osm: ["amenity=bar", "amenity=pub"]
      overture:
        - bar
        - cocktail_bar
        - sports_bar
        - wine_bar
        - hookah_bar
        - dive_bar
        - beer_bar
        - gay_bar
        - hotel_bar
        - whiskey_bar
        - tiki_bar
        - sake_bar
        - piano_bar
        - champagne_bar
        - beer_garden
        - pub
        - gastropub
        - irish_pub
      nys_sla: ["Food & Beverage Business", "Summer Food & Beverage Business", "Club", "Cabaret", "Bottle Club"]
      # DOHMH deliberately never emits `bar` (see dohmh.py docstring) --
      # bars with a food-service license are undercounted here (H-D9).

  childcare:
    label: "Childcare"
    naics_2022: ["624410"]
    naics_2017: ["624410"]   # unchanged (title text-only tweak: "Child Day
                             # Care Services" -> "Child Care Services")
    # D69 (owner, 2026-09-11) — amendment to the D52 supply-set principle.
    # The DOHMH roster gy3q-4tzp that anchors this category covers GROUP
    # settings only: Health Code Article 47 centres and Article 43 school-based
    # programmes. Home-based Family and Group Family Day Care is licensed by
    # NYS OCFS and appears in NO NYC feed, so the registry CANNOT corroborate a
    # home-based provider — not because the provider is a ghost, but by
    # construction. D52's lone-aggregator veto would therefore delete supply
    # exactly where home-based care dominates (it fell 6,066 -> 2,657 when the
    # anchor qualified at coverage 0.85), manufacturing the childcare deserts
    # this project exists to avoid. Marking the anchor a FLOOR keeps those
    # records in `in_principled`; the anchor still ranks first for canonical
    # geometry and name (score/dedup.source_rank), still feeds anchor_coverage
    # and still qualifies. Read by score/supply.floor_anchor_categories().
    anchor_is_floor: true
    sources:
      osm: ["amenity=kindergarten", "amenity=childcare"]
      overture: [child_care_and_day_care, day_care_preschool, preschool]

  clinic:
    label: "Clinic / urgent care"
    # NOT USABLE FOR HEADLINE CLAIMS — D30 (2026-09-03), the precedent the
    # 2026-09-14 ruling extends to hair_barber and tailor_repair. No Google
    # Table A primary type isolates 621111/621493 (`doctor` is every solo
    # physician's office), so clinic has no GOOGLE_TYPES entry, cannot be
    # validated at any radius, and its coverage grade is C "unvalidated" by
    # construction until the urgent-care re-anchor (GTM-107) lands.
    # docs/coverage-validation-2026-09.md §4; validation/google_places.py.
    headline: false
    naics_2022: ["621111", "621493"]
    naics_2017: ["621111", "621493"]   # unchanged
    sources:
      osm: ["amenity=clinic", "amenity=doctors"]
      overture: [urgent_care_clinic, walk_in_clinic, public_health_clinic, medical_center]

  fitness:
    label: "Fitness"
    naics_2022: ["713940"]
    naics_2017: ["713940"]   # unchanged
    sources:
      osm: ["leisure=fitness_centre"]
      overture:
        - gym
        - fitness_trainer
        - gymnastics_center
        - boxing_gym
        - gymnastics_club
        - rock_climbing_gym
        - aerial_fitness_center
        - yoga_studio
        - pilates_studio
        - martial_arts_club

  bank:
    label: "Bank branch"
    naics_2022: ["522110"]   # excludes credit unions (522130), out of scope --
                             # note: overture's "bank_credit_union" primary
                             # category maps to this slug too (see
                             # overture_places.py), a real scope mismatch
                             # against the NAICS definition, flagged not fixed.
    naics_2017: ["522110"]
    sources:
      osm: ["amenity=bank"]
      overture: [banks, bank_credit_union]

  hardware:
    label: "Hardware / home supply"
    naics_2022: ["444140"]   # RECODE: was 444130 "Hardware Stores" under 2017;
                             # 2022 renamed/renumbered to "Hardware Retailers"
                             # under the 44-45 retail-sector recode.
    naics_2017: ["444130"]
    sources:
      osm: ["shop=hardware", "shop=doityourself"]
      overture: [hardware_store, home_improvement_store]

  bathhouse_sauna:
    label: "Bathhouse / sauna"
    # DEFINITION (pinned 2026-09-17 so the citywide base-rate enumeration for
    # QUESTIONS D56 counts the same things; do not reword without re-counting):
    definition: >
      public-admission bathing facility whose primary offer is heat/water
      bathing — bathhouse, sauna, steam room, banya, hammam, Korean
      spa/jjimjilbang, per-visit plunge/thermal pools. Excludes day spa /
      health spa (stay in nails_beauty pending the wide-slug ruling),
      nail/med/massage-only, hotel-guest-only spas, gym or
      residential-building saunas, and membership-only clubs (flag, do not
      count). Owner ruling 2026-09-17 (via GTM-199): "day spa out UNLESS
      bathing is the primary offer" — Juvenex, Great Jones Spa and Fountain
      of Youth count; MN+BK stock reads ~21.
    # 16th slug -- AC-1 Step 1 (CONTEXT.md §7, owner ruling 2026-09-16, GTM-198),
    # landed 2026-09-17 through docs/CATEGORY-EXPANSION.md as far as G0.
    # NOT USABLE FOR HEADLINE CLAIMS, for two reasons that are both stronger
    # than the D30 precedent: (1) the prevalence-gap premise fails -- a
    # bathhouse is a destination amenity with a 15-30 minute travel catchment
    # (CONTEXT.md §7 AC-1 point 5, Appendix A8), so "missing within reach_m"
    # is true for nearly every MN+BK address and says nothing; (2) the only
    # anchor (nyc_dohmh_pool_permits, below) has no facility-type column and
    # its ZBP denominator (812199) is 20-30x the category, so G3 is
    # unmeasurable, not merely failed. Its gaps annotate; they never lead.
    #
    # OWNER RULINGS 2026-09-17 (GTM-198): (1) SHIPS AS A NON-FILTERING SIGNAL
    # (docs/CATEGORY-EXPANSION.md §4) -- headline stays false, the slug can
    # reorder or annotate a card and never gates one; removing it must leave
    # gap_score, lead_category, n_missing and the missing set of the other
    # fifteen byte-identical. (2) NARROW slug, with the day-spa clause in the
    # definition above. (3) The three exact-set pins (demand caveat set,
    # demoted set, D43 bike-OD family) are widened to sixteen. (4) G7 ships a
    # `not_fitted` row until the first ingest on the announced hash.
    ships_as: signal
    headline: false
    # The pinned name-term rule (see the `sources:` comment below for why it
    # is part of the definition). Mirrored byte-for-byte by
    # sources/base.py BATHHOUSE_NAME_TERMS / BATHHOUSE_NAME_SUBTAGS.
    name_terms: "(?i)\\b(bath ?house|baths?\\b(?!\\s*(?:&|and)\\s*body)|bathing|banya|sauna|jjimjilbang|hammam|onsen|schvitz|shvitz|spa castle|world spa|othership|qc ny|mermaid spa|juvenex|great jones spa|fountain of youth)"
    # Excluded even on an include hit, and also applied to the native sauna /
    # onsen / "Bath House" tags: private-suite and infrared studios, gym and
    # residential rooms, massage-only, "Bath & Body" retail. Studios and clubs
    # are "flag, do not count": they live in the hand list, not in supply.
    name_terms_exclude: "(?i)(infrared|light sauna|sauna studio|sauna lounge|sauna suites?|perspire|higherdose|beem\\b|sw3at|akari|kove\\b|nlighten|n°lighten|mobile sauna|sauna barrels|bath co\\b|bath (?:&|and) body|bathing area|remodel|contractor|construction|east side club|equinox|crunch|gym|fitness|condominium|condo\\b|tower|residence|apartments?|massage)"
    name_terms_apply_to:
      overture: [spas, health_spa, day_spa]
      foursquare: [spa]
    naics_2022: ["812199"]   # Other Personal Care Services: saunas, steam
                             # baths, bathhouses, Turkish baths -- AND tattoo
                             # parlours, tanning salons, ear piercing, day
                             # spas, colonic clinics. Far broader than the
                             # slug; see zbp_naics.yaml (confidence: medium).
    naics_2017: ["812199"]   # unchanged across the 2022 recode
    sources:
      # NARROW definition (owner ruling pending, GTM-198): sauna, bathhouse,
      # banya, Korean/Russian/Turkish bath. Day spa / health spa / generic
      # `spas` STAY in nails_beauty -- moving them would pull ~4,300 Overture
      # rows and ~2,500 Foursquare "Spa" rows out of that category's supply
      # set (staging.poi, read 2026-09-17) and move its hash and its D14
      # ratio for no new evidence at any address. Widen only by ruling.
      osm: ["leisure=sauna", "amenity=public_bath"]
      overture: [sauna, onsen]
      # EXCLUDED, explicitly and permanently: Overture `public_bath_houses`.
      # GTM-199's enumeration (peer scratch gtm199_warehouse.md §1) read all
      # 63 MN+BK rows: 100% NYC Parks comfort stations, zero bathhouses. Never
      # map it, whatever a future taxonomy note says the slug means.
      # Overture `private_association` (Lore Bathing Club) is also unmapped;
      # membership clubs are "flag, do not count" under the definition.
      # Foursquare leaves: "Sauna" (Sports and Recreation) and "Bath House"
      # (Health and Beauty Service) -- foursquare_places.LEAF_CATEGORY. Until
      # 2026-09-17 both were unmapped, which is why Brooklyn Bathhouse, Lore
      # and Othership Williamsburg never entered staging.poi (GTM-199 §3).
      #
      # THE NAME-TERM RULE, PINNED. Every real NYC bathhouse that Overture
      # carries sits in `spas` / `health_spa` / `day_spa` (4,317 rows, all
      # nails_beauty today) and every Foursquare one in the "Spa" leaf --
      # cityWell, QC NY, World Spa, Bathhouse Flatiron, Othership, The Spa
      # Club, AIRE UES, The Altar (GTM-199 §3). A name-term rule over those
      # sub-tags is therefore PART OF THE DEFINITION: it is the ONLY way the
      # narrow/wide split can be applied inside the spa sub-tags at all. Code
      # mirror: sources/base.py BATHHOUSE_NAME_TERMS (drift-tested). It is a
      # FLOOR -- brand names with no bathing word (The Altar, cityWell, The
      # Spa Club) need the hand list -- and it must never be applied outside
      # the spa sub-tags, where "bath" is a shop and "sauna" a gym room.
      # HAND-REVIEW RULE for a day-spa-tagged hit (owner 2026-09-17): "day spa
      # out UNLESS bathing is the primary offer" -- Juvenex, Great Jones Spa
      # and Fountain of Youth count, so their names are include terms; a day
      # spa whose bathing is an add-on to treatments stays in nails_beauty.
      # (pattern and sub-tag list are the slug-level `name_terms` /
      # `name_terms_apply_to` keys below, outside `sources:`.)
      # ANCHOR (composite, conditional -- P1). (a) DOHMH in-house CAFE permits
      # in the restaurant roster (nyc_dohmh_restaurants, 43nn-pn8j): nine
      # bathhouses hold one -- Bathhouse x3, Brooklyn Bathhouse, World Spa, Spa
      # Castle, R&T Baths, AIRE, NY Spa & Sauna, Spa 88, The Spa Club -- a real
      # government registration with a premises address whose gov_filing
      # first-seen trails opening by 0-5 months (GTM-199 §1, §3), against
      # Foursquare date_created which LEADS opening badly (World Spa listed
      # 2019-03, opened 2022-12). Conditional on the bathhouse serving food, so
      # coverage is a FLOOR: the D65 childcare asymmetry, a bathhouse without a
      # cafe is not a ghost. (b) DOHMH pool permits 3kfa-rvez, Health Code
      # Article 165 "bathing establishment" -- a permit to operate with street
      # address, BBL, BIN and lat/long, but NO facility type: the 1,221 permits
      # are every condo, hotel, gym and school pool, and the bathhouse subset is
      # separable only by facility_name keyword. Sauna-only studios with no
      # pool or plunge are outside Article 165 altogether. Neither half is
      # ingested for this slug; registry.yaml nyc_dohmh_pool_permits.
      dohmh: ["in-house cafe permit on the restaurant roster, matched by premises address + name_terms -- a floor, not a census"]
      dohmh_pools: ["facility_name keyword (bath|banya|sauna|spa|schvitz|russian|turkish|korean) -- keyword match, NOT a licence category; registry.yaml nyc_dohmh_pool_permits"]
